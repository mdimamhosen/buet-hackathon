version: '3.8'

services:
  postgres:
    image: postgres:15.1-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: darktriad
      POSTGRES_USER: darktriad_user
      POSTGRES_PASSWORD: YYBZCmxpRdEu7vOcXFx4ev84M7Ok4YyX
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/generated_data.sql:/docker-entrypoint-initdb.d/generated_data.sql:ro
  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://darktriad_user:YYBZCmxpRdEu7vOcXFx4ev84M7Ok4YyX@postgres:5432/darktriad?sslmode=disable
    depends_on:
      - postgres

volumes:
  postgres_data: